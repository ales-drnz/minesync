name: spike_web
description: "Spike: web UI dell'hub in Flutter web (usa e getta)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Font pixel OFL scaricati da github.com/google/fonts (vedi fonts/OFL-*.txt)
  fonts:
    - family: PixelifySans
      fonts:
        - asset: fonts/PixelifySans-VF.ttf
    - family: Silkscreen
      fonts:
        - asset: fonts/Silkscreen-Regular.ttf
        - asset: fonts/Silkscreen-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-VF.ttf
