<!DOCTYPE html>
<html lang="it">
<head>
  <!-- base href "/" serve alla strategia URL a percorso (/admin). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MineSync hub (spike)">
  <meta name="color-scheme" content="dark">
  <!-- __BUILD__ viene sostituito dal server con l'id della build: tutto ciò
       che sta sotto /b/<id>/ è immutabile e si mette in cache per un anno. -->
  <link rel="icon" type="image/png" href="/b/__BUILD__/favicon.png">
  <!-- Precarico: il motore e il programma partono in parallelo all'HTML. -->
  __PRELOAD__
  <title>MineSync Hub</title>
  <style>
    /* Splash in HTML/CSS puro: compare al primo byte, prima di Flutter. */
    html, body { margin: 0; height: 100%; background: #17140f; color: #f6eedb; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 16px/1.4 monospace; }
    #splash .logo { width: 48px; height: 48px; image-rendering: pixelated;
      background:
        linear-gradient(#9be06a 0 0) 0 0/100% 33% no-repeat,
        linear-gradient(#7a5332 0 0) 0 100%/100% 67% no-repeat;
      box-shadow: 0 0 0 4px #050403; }
    #splash .bar { width: 160px; height: 10px; box-shadow: 0 0 0 3px #050403;
      background: #110e0a; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 30%; background: #62b53c;
      animation: run 1.1s steps(8) infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    body.ready #splash { display: none; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo"></div>
    <div>MINESYNC · caricamento dell'hub…</div>
    <div class="bar"><i></i></div>
    <noscript>Serve JavaScript per usare la web UI dell'hub.</noscript>
  </div>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
