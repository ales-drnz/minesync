name: pixel_spike
description: "Spike MineSync 0.1.0: resa pixel-art nitida in Flutter (desktop e web)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  # MIT: lettura dei PNG golden nello script di analisi
  image: ^4.13.1

flutter:
  uses-material-design: false
  # Font OFL 1.1 (google/fonts), licenze in assets/fonts/OFL-*.txt
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-wght.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
    # Silkscreen con coordinate riallineate alla griglia (tool/snap_silkscreen.py)
    - family: SilkscreenGrid
      fonts:
        - asset: assets/fonts/SilkscreenGrid-Regular.ttf
        - asset: assets/fonts/SilkscreenGrid-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-wght.ttf
