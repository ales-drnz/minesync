name: minesync_hub_web
description: "The MineSync hub web UI."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Routing con URL veri e tasto indietro del browser (BSD-3).
  go_router: ^18.1.4
  ms_l10n: ^0.1.0
  ms_protocol: ^0.1.0
  ms_ui: any
  # fetch, EventSource, localStorage del browser (BSD-3); solo in main.dart
  # e nei file browser_*.dart, mai nei test sulla VM.
  web: ^1.1.2

dev_dependencies:
  # orologio finto per la riconnessione SSE (BSD-3, già nel lockfile via flutter_test)
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  # solo per il test di contratto: un hub vero in-process sulla VM (BSD-3, del workspace)
  minesync_hub: ^0.1.0
  # SHA-256 dei blob nel test di contratto (BSD-3, già nel workspace)
  crypto: ^3.0.8
