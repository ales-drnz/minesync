# CI della riscrittura 0.1.0 (Dart/Flutter): controlli su Linux e build dei
# tre sistemi. Gira sui branch rewrite/** e sulle pull request verso main;
# la ci.yml della 3.x resta finché il codice Go non viene rimosso.
name: CI 0.1

on:
  push:
    branches: ['rewrite/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tools/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: App desktop
        working-directory: apps/desktop
        run: flutter build ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }} --release
      - name: Hub web (wasm con fallback JS)
        if: runner.os == 'Linux'
        working-directory: apps/hub_web
        run: flutter build web --wasm
      - name: CLI e guard
        run: |
          mkdir -p dist
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          dart compile exe apps/cli/bin/minesync_cli.dart -o dist/minesync$ext
          dart compile exe apps/guard/bin/minesync_guard.dart -o dist/minesync-guard$ext
      - name: Hub (linux amd64 e arm64)
        if: runner.os == 'Linux'
        run: |
          dart compile exe --target-os linux --target-arch x64 apps/hub/bin/minesync_hub.dart -o dist/minesync-hub-amd64
          dart compile exe --target-os linux --target-arch arm64 apps/hub/bin/minesync_hub.dart -o dist/minesync-hub-arm64
