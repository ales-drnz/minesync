<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineSync Hub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo" id="logo"></span>
      <span class="brand-txt">MINESYNC <span class="ver" id="ver"></span></span>
    </div>
    <nav class="tabs">
      <a id="tab-home" href="#" data-i18n="nav.home">Server</a>
      <a id="tab-dl" href="#" data-i18n="nav.dl">Client</a>
      <a id="tab-settings" href="#" hidden data-i18n-title="nav.settings" title="Impostazioni"><span class="tab-lbl" data-i18n="nav.settings">Impostazioni</span></a>
    </nav>
    <div class="head-right">
      <span id="conn" class="connpill off"><span class="dot"></span><span id="conn-txt">offline</span></span>
      <span id="who" class="who"></span>
      <div id="lang-sw" class="langsw" role="group" data-i18n-title="lang.title" title="Lingua">
        <button type="button" data-lang="it" lang="it">IT</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <button id="theme-btn" class="ghost navbtn icon" data-i18n-title="theme.title" title="Tema chiaro/scuro"></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
