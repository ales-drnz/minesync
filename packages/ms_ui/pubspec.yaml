name: ms_ui
description: "MineSync design system: tokens, pixel components, icons and fonts."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  archive: ^4.7.1
  flutter_test:
    sdk: flutter

flutter:
  # logo dell'app: le app lo installano come icona di sistema (es. Linux)
  assets:
    - assets/brand/minesync-256.png
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-wght.ttf
